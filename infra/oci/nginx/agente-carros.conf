# Proxy reverso na frente do Streamlit.
#
# O Streamlit escuta apenas em 127.0.0.1:8501; quem fala com a internet e o
# nginx. Isso mantem uma unica porta exposta e deixa o TLS num lugar so.

# O Streamlit conversa com o navegador por WebSocket. Sem o upgrade abaixo a
# pagina carrega e trava em "Connecting...". Este map vale para o http inteiro,
# porque sites-enabled/ e incluido dentro do bloco http.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    access_log /var/log/nginx/agente-carros.access.log;
    error_log  /var/log/nginx/agente-carros.error.log;

    client_max_body_size 25m;

    # Sonda usada pelo publicar.sh e por qualquer monitoramento externo.
    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
        access_log off;
    }

    # O Streamlit serve um HTML fixo com <title>Streamlit</title>, e so
    # troca o titulo depois que o app conecta pelo WebSocket. Quem abre a
    # pagina ve "Streamlit" na aba por um instante — e e o que aparece numa
    # captura de tela feita durante o carregamento.
    #
    # A reescrita vale so para o documento raiz. Aplicar a tudo obrigaria a
    # desligar a compressao dos pacotes de JavaScript, que sao o grosso do
    # download.
    location = / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # sub_filter nao reescreve conteudo comprimido.
        proxy_set_header Accept-Encoding "";
        sub_filter '<title>Streamlit</title>' '<title>Consultor de Veículos</title>';
        sub_filter_once on;
    }

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uma resposta do agente pode levar dezenas de segundos: varias
        # chamadas de ferramenta antes do texto final. O timeout padrao de
        # 60s do nginx derrubaria a conexao no meio.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }
}
